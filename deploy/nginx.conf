# cue — nginx reverse proxy for cue.celox.io
#
# 1. Place at /etc/nginx/sites-available/cue and symlink into sites-enabled.
# 2. Obtain a cert:  certbot --nginx -d cue.celox.io
#    (certbot fills in the ssl_certificate lines + the :80 -> :443 redirect).
# 3. Test + reload:  nginx -t && systemctl reload nginx
#
# The app (container) listens on 127.0.0.1:8791 and sets its own CSP +
# security headers; nginx only adds HSTS.

server {
    listen 80;
    server_name cue.celox.io;
    # certbot adds the redirect to https here.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name cue.celox.io;

    # Managed by certbot:
    # ssl_certificate     /etc/letsencrypt/live/cue.celox.io/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/cue.celox.io/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Allow large-ish .txt imports.
    client_max_body_size 25m;

    # A named upstream so `proxy_next_upstream` has something to retry against.
    # With a single server nginx still honours max_fails/fail_timeout, and the
    # retry below is what covers the second or two in which a deploy has
    # stopped the old container and the new one is still booting.
    location / {
        proxy_pass http://cue_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Must stay above the long-poll ceiling (25 s) — see app/longpoll.py.
        proxy_read_timeout 60s;

        # Ride out a restarting backend instead of handing the visitor a 502.
        # GET/HEAD only by default; a POST is NOT replayed, because retrying a
        # mutation that may already have been applied is worse than an error.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 6s;
        proxy_connect_timeout 2s;

        # A deploy recreates the container, which leaves the port closed for
        # about four seconds — measured, and not removable without running two
        # containers side by side. Serve a page that says so and reloads itself
        # instead of nginx's bare 502. No "=" before @restarting: that would
        # relabel the answer 200, which lies to crawlers and uptime monitors.
        proxy_intercept_errors on;
        error_page 502 503 504 @restarting;
    }

    # API callers get a status code, never HTML: the client parses JSON, so a
    # maintenance page would surface as a parse error instead of "server away".
    location /api/ {
        proxy_pass http://cue_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 2s;
    }

    # Install with: scp deploy/maintenance.html root@host:/var/www/cue-maintenance.html
    location @restarting {
        root /var/www;
        try_files /cue-maintenance.html =503;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        internal;
    }
}

upstream cue_app {
    # `max_fails=0`: never take the only backend out of rotation — with one
    # server that would turn a brief hiccup into a hard 502 for fail_timeout
    # seconds, which is precisely the outage this is meant to avoid.
    server 127.0.0.1:8791 max_fails=0;
    keepalive 16;
}
