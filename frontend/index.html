<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the
         layout viewport instead of sliding over it, so `dvh` sizing keeps a
         dialog's action buttons above the keys. iOS ignores the hint — there
         `lib/viewport.ts` does the same job from the visualViewport API. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#6750A4" />
    <meta
      name="description"
      content="cue — die Prompt-Queue für Claude-Code-Sessions: Prompts planen, als Kanban organisieren und headless über die CLI ausführen. Mit Runs, Capture-Verlauf und Snippet-Werkbank."
    />
    <title>cue — Prompt-Queue für Claude Code</title>

    <!-- Open Graph (WhatsApp, Slack, LinkedIn, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="cue" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:url" content="https://cue.celox.io/" />
    <meta property="og:title" content="cue — Prompt-Queue für Claude Code" />
    <meta
      property="og:description"
      content="Prompts planen, als Kanban organisieren und headless über die Claude-Code-CLI ausführen — mit Runs, Capture-Verlauf und Snippet-Werkbank."
    />
    <meta property="og:image" content="https://cue.celox.io/og.png" />
    <meta property="og:image:secure_url" content="https://cue.celox.io/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="cue — die Prompt-Queue für Claude-Code-Sessions" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="cue — Prompt-Queue für Claude Code" />
    <meta
      name="twitter:description"
      content="Prompts planen, als Kanban organisieren und headless über die Claude-Code-CLI ausführen."
    />
    <meta name="twitter:image" content="https://cue.celox.io/og.png" />

    <link rel="canonical" href="https://cue.celox.io/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..800&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0..1"
      rel="stylesheet"
    />
    <!-- Pre-paint theme to avoid FOUC. External on purpose: the CSP
         (script-src 'self') blocks inline scripts. -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
