services:
  cue:
    build: .
    image: cue:latest
    container_name: cue
    restart: unless-stopped
    # Bind to loopback only — the reverse proxy (Caddy/nginx) sits in front and
    # terminates TLS for cue.celox.io.
    ports:
      - "127.0.0.1:8791:8000"
    # Don't let a stopping container hold the port: uvicorn caps its own
    # graceful shutdown at 2 s (see the Dockerfile), so anything beyond this is
    # a hung process, not a slow request.
    stop_grace_period: 5s
    env_file:
      - .env
    volumes:
      # Persistent SQLite DB + uploaded imports.
      - cue-data:/data

volumes:
  cue-data:
