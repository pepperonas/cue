[project]
name = "cue-backend"
version = "0.3.0"
description = "cue — Prompt-Queue für Claude-Code-Sessions (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    # Per-user API keys are encrypted at rest — the nightly backup would
    # otherwise carry other people's Anthropic keys in clear text.
    "cryptography>=43.0",
    # Server-side optimizer for users who bring their own key. The owner's
    # path still goes through the Claude Code CLI on the runner Mac.
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
